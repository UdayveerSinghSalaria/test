services:
  - type: web
    name: saarthiflow-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://testudayrepo.netlify.app
      - key: CORS_ORIGINS
        value: https://testudayrepo.netlify.app,http://localhost:5173,http://localhost:5174
      - key: BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
